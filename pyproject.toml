[project]
name = "anipics"
version = "2.0.0"
description = "Simple module to get anime pictures"
authors = [{ name = "Daniel", email = "D4n13l3k00@yandex.ru" }]
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.urls]
Repository = "https://github.com/D4n13l3k00/anipics"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
markers = [
    "live: tests that call external services",
]

[tool.hatch.build.targets.wheel]
packages = ["anipics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
